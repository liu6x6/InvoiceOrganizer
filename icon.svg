<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DF9"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#122F6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EEFB"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27499F"/>
      <stop offset="1" stop-color="#0B1F4B"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#BFDBFE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#081C46" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#081C46" flood-opacity="0.3"/>
    </filter>
    <clipPath id="squircleClip">
      <path d="M512 0 C150 0 0 150 0 512 C0 874 150 1024 512 1024 C874 1024 1024 874 1024 512 C1024 150 874 0 512 0 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- 背景 -->
    <path d="M512 0 C150 0 0 150 0 512 C0 874 150 1024 512 1024 C874 1024 1024 874 1024 512 C1024 150 874 0 512 0 Z" fill="url(#bg)"/>
    <path d="M512 0 C150 0 0 150 0 512 C0 874 150 1024 512 1024 C874 1024 1024 874 1024 512 C1024 150 874 0 512 0 Z" fill="url(#glow)"/>
    <circle cx="900" cy="920" r="330" fill="#38BDF8" opacity="0.10"/>
    <circle cx="960" cy="700" r="180" fill="#818CF8" opacity="0.10"/>

    <!-- 底层叠放的票据（批量合并意象） -->
    <rect x="300" y="150" width="380" height="560" rx="26" fill="#FFFFFF" opacity="0.22" transform="rotate(-8 490 430)"/>

    <!-- 主发票：锯齿底边 -->
    <g filter="url(#shadow)">
      <path d="M296 176 H644 Q672 176 672 204 V772 L646.75 796 L621.5 772 L596.25 796 L571 772 L545.75 796 L520.5 772 L495.25 796 L470 772 L444.75 796 L419.5 772 L394.25 796 L369 772 L343.75 796 L318.5 772 L293.25 796 L268 772 V204 Q268 176 296 176 Z" fill="url(#paper)"/>
    </g>
    <!-- 票面内容 -->
    <rect x="304" y="214" width="132" height="30" rx="9" fill="url(#chip)"/>
    <rect x="560" y="218" width="76" height="10" rx="5" fill="#C9D8F0"/>
    <rect x="592" y="236" width="44" height="10" rx="5" fill="#D7E3F6"/>
    <rect x="304" y="272" width="250" height="16" rx="8" fill="#9DB8E4"/>
    <rect x="304" y="312" width="336" height="12" rx="6" fill="#C9D8F0"/>
    <rect x="304" y="340" width="300" height="12" rx="6" fill="#C9D8F0"/>
    <rect x="304" y="368" width="320" height="12" rx="6" fill="#C9D8F0"/>
    <line x1="304" y1="412" x2="636" y2="412" stroke="#B9CBE8" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round"/>
    <rect x="304" y="436" width="90" height="14" rx="7" fill="#9DB8E4"/>
    <rect x="470" y="430" width="166" height="26" rx="9" fill="#2563EB" opacity="0.9"/>

    <!-- 金币 ¥ -->
    <g transform="translate(352 640)" filter="url(#soft)">
      <circle r="78" fill="#B45309"/>
      <circle r="70" fill="url(#coin)"/>
      <circle r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
      <path d="M-26 -34 L0 -2 L26 -34 M0 -2 V38 M-22 6 H22 M-22 22 H22" fill="none" stroke="#92400E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="-26" cy="-32" rx="24" ry="12" fill="#FFFFFF" opacity="0.4" transform="rotate(-32 -26 -32)"/>
    </g>

    <!-- 放大镜：识别 + 核验 -->
    <g transform="translate(648 636)" filter="url(#shadow)">
      <g transform="rotate(-45)">
        <rect x="-27" y="132" width="54" height="150" rx="27" fill="url(#handle)"/>
        <rect x="-13" y="146" width="10" height="110" rx="5" fill="#FFFFFF" opacity="0.18"/>
      </g>
      <circle r="131" fill="url(#glass)"/>
      <circle r="148" fill="none" stroke="url(#rim)" stroke-width="32"/>
      <circle r="131" fill="none" stroke="#1E3A8A" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M-96 -62 A114 114 0 0 1 -22 -112" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
      <path d="M-56 4 L-14 46 L60 -38" fill="none" stroke="url(#check)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 自动识别的星芒 -->
    <path d="M806 206 C810 226 816 232 836 236 C816 240 810 246 806 266 C802 246 796 240 776 236 C796 232 802 226 806 206 Z" fill="#FFFFFF" opacity="0.92"/>
    <path d="M862 304 C865 317 869 321 882 324 C869 327 865 331 862 344 C859 331 855 327 842 324 C855 321 859 317 862 304 Z" fill="#7DD3FC" opacity="0.85"/>

    <!-- 内描边 -->
    <path d="M512 0 C150 0 0 150 0 512 C0 874 150 1024 512 1024 C874 1024 1024 874 1024 512 C1024 150 874 0 512 0 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>
  </g>
</svg>
